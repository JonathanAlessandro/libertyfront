<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112" role="img" aria-labelledby="mascot-title">
  <title id="mascot-title">Atendente Liberty Saúde</title>
  <style>
    .character { animation: bob 3s ease-in-out infinite; transform-origin: 56px 57px; }
    .hand { animation: greet 3s ease-in-out infinite; transform-origin: 88px 70px; }
    .eyes { animation: blink 5s ease-in-out infinite; transform-origin: 55px 47px; }
    .mouth { animation: talk 3s ease-in-out infinite; transform-origin: 56px 59px; }
    .spark { animation: sparkle 3s ease-in-out infinite; transform-origin: 99px 22px; }
    @keyframes bob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-5px) rotate(2deg); } }
    @keyframes greet { 0%,14%,55%,100% { transform: rotate(0); } 24%,40% { transform: rotate(-25deg); } 32% { transform: rotate(12deg); } }
    @keyframes blink { 0%,43%,47%,100% { transform: scaleY(1); } 45% { transform: scaleY(.1); } }
    @keyframes talk { 0%,20%,42%,100% { transform: scaleY(1); } 27%,34% { transform: scaleY(.45); } }
    @keyframes sparkle { 0%,55%,100% { opacity: .35; transform: scale(.7); } 72% { opacity: 1; transform: scale(1.1); } }
    @media (prefers-reduced-motion: reduce) { .character,.hand,.eyes,.mouth,.spark { animation: none; } }
  </style>
  <ellipse cx="56" cy="105" rx="30" ry="4" fill="#163847" opacity=".13"/>
  <g class="character" stroke="#193953" stroke-linejoin="round" stroke-linecap="round">
    <path d="M35 84 30 98q8 6 16 1l7-13M68 86l8 14q8 3 13-4l-8-16" fill="#4779da" stroke-width="3"/>
    <path d="M35 68q-11 1-18 9l-10-2q-5 4-2 10l14 3q8-2 20-11" fill="#648deb" stroke-width="3"/>
    <path d="M34 69q-7 13-2 22 17 10 44 0 5-10-1-23" fill="#4779da" stroke-width="3"/>
    <path d="M53 75h11m-5-5v10" stroke="#e5f8fb" stroke-width="3"/>
    <g class="hand">
      <path d="M75 72 88 70l7-9q6-1 7 5l-4 6 5 2q2 5-3 8l-16 1-13-5" fill="#6995f2" stroke-width="3"/>
    </g>
    <path d="M25 33q-4-8 4-13 1-9 11-9 7-8 17-5 9-4 16 5 11-1 13 11 8 6 5 15 6 9-2 16l-3 16q-28 18-59 0l-4-17q-8-9 2-19Z" fill="#729cf4" stroke-width="3"/>
    <path d="M31 32q-7 8-3 21M81 32q7 8 3 21" fill="none" stroke="#d8e9ff" stroke-width="3" opacity=".75"/>
    <rect x="28" y="30" width="56" height="43" rx="13" fill="#173e58" stroke-width="3"/>
    <rect x="33" y="35" width="46" height="33" rx="9" fill="#0e3045" stroke="none"/>
    <g class="eyes" fill="#b8faff" stroke="none"><ellipse cx="46" cy="48" rx="3.2" ry="4.3"/><ellipse cx="67" cy="48" rx="3.2" ry="4.3"/></g>
    <circle cx="38" cy="58" r="3" fill="#f5aeb6" stroke="none" opacity=".9"/>
    <circle cx="75" cy="58" r="3" fill="#f5aeb6" stroke="none" opacity=".9"/>
    <path class="mouth" d="M48 57q8 9 17 0" fill="none" stroke="#b8faff" stroke-width="3"/>
    <path d="M25 47h-4q-5 0-5 5v8q0 5 6 5h4M86 47h4q5 0 5 5v8q0 5-6 5h-4" fill="#517de1" stroke-width="3"/>
    <path d="M94 62q0 13-16 13h-8" fill="none" stroke="#193953" stroke-width="3"/>
    <rect x="65" y="72" width="9" height="5" rx="2.5" fill="#b8faff" stroke="#193953" stroke-width="2"/>
  </g>
  <path class="spark" d="m100 17 2 5 5 2-5 2-2 5-2-5-5-2 5-2Z" fill="#f3b67a"/>
</svg>
